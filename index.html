<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="container">
        <header class="header">
            <div>
                <h1>Expense Tracker</h1>
                <p>Manage your money, one step at a time.</p>
            </div>
            <div class="date-display" id="todayDate"></div>
        </header>
        <section class="summary">
            <div class="summary-card balance-card">
                <p>Total Balance</p>
                <h2 id="totalBalance">0.00</h2>
            </div>
            <div class="summary-card income-card">
                <p>Total Income</p>
                <h2 id="totalIncome">0.00</h2>
            </div>
            <div class="summary-card expense-card">
                <p>Total Expenses</p>
                <h2 id="totalExpenses">0.00</h2>
            </div>
        </section>
        <section class="form-section">
            <h2>Add New Transaction</h2>
            <form id="transactionForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="description">Transaction Name</label>
                        <input
                            type="text"
                            id="description"
                            placeholder="e.g. Grocery shopping"
                            maxlength="80"
                            required
                        >
                    </div>
                    <div class="form-group">
                        <label for="amount">Amount (EGP)</label>
                        <input
                            type="number"
                            id="amount"
                            placeholder="0.00"
                            min="0.01"
                            step="0.01"
                            required
                        >
                    </div>
                    <div class="form-group">
                        <label for="type">Transaction Type</label>
                        <select id="type" required>
                            <option value="expense">Expense</option>
                            <option value="income">Income</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="category">Category</label>
                        <select id="category" required>
                            <option value="Food">Food</option>
                            <option value="Transport">Transport</option>
                            <option value="Shopping">Shopping</option>
                            <option value="Bills">Bills</option>
                            <option value="Health">Health</option>
                            <option value="Education">Education</option>
                            <option value="Entertainment">Entertainment</option>
                            <option value="Salary">Salary</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="transactionDate">Date</label>
                        <input
                            type="date"
                            id="transactionDate"
                            required
                        >
                    </div>
                </div>
                <button type="submit" class="add-button">
                    + Add Transaction
                </button>
            </form>
        </section>
        <section class="transactions-section">
            <div class="transactions-header">
                <h2>Transaction History</h2>
                <input
                    type="search"
                    id="searchInput"
                    placeholder="Search transactions"
                    aria-label="Search transactions"
                >
            </div>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Category</th>
                            <th>Date</th>
                            <th>Amount</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="transactionList">
                    </tbody>
                </table>
            </div>
            <p id="emptyMessage" class="empty-message">
                No transactions yet. Add your first transaction!
            </p>
        </section>
    </div>
</body>
</html>
